<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <!-- 個人用なので、検索エンジンに載せない -->
   <meta name="robots" content="noindex, nofollow, noarchive">
   <title>DTM工程管理</title>
   <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
   <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
   <link rel="manifest" href="manifest.webmanifest">
   <!-- ヘッダーの背景(--surface)と揃える -->
   <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" data-scheme="light">
   <meta name="theme-color" content="#1e2129" media="(prefers-color-scheme: dark)" data-scheme="dark">
   <!-- 設定で選んだUIテーマを、描画の前に当てる(モジュールを待つと、一瞬システムの色で表示されるため)。
      キーは js/theme.js と同じ -->
   <script>
      try {
         const theme = localStorage.getItem('dtm-proj:theme');
         if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {
         // localStorage を使えない環境では、システムに合わせる
      }
   </script>
   <link rel="stylesheet" href="css/tokens.css">
   <link rel="stylesheet" href="css/base.css">
   <link rel="stylesheet" href="css/projectList.css">
   <link rel="stylesheet" href="css/board.css">
   <link rel="stylesheet" href="css/drawer.css">
   <link rel="stylesheet" href="css/gantt.css">
   <link rel="stylesheet" href="css/arrangement.css">
   <link rel="stylesheet" href="css/pianoroll.css">
   <link rel="stylesheet" href="css/settings.css">
   <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
   <script type="module" src="js/main.js"></script>
</head>
<body>
   <header class="app-header">
      <a class="app-brand" href="#/" aria-label="DTM工程管理" title="DTM工程管理">
         <!-- アプリアイコン(icons/icon.svg)の記号だけを、背景なしで出す。線の色は CSS の color(テーマのアクセント色)に従う -->
         <svg class="app-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15V6"/>
            <path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/>
            <path d="M12 12H3"/>
            <path d="M16 6H3"/>
            <path d="M12 18H3"/>
         </svg>
      </a>
      <nav class="app-nav">
         <a href="#/" data-nav="projects">プロジェクト</a>
         <a href="#/settings" data-nav="settings">設定</a>
      </nav>
   </header>
   <main id="app"></main>
   <div id="overlay-root"></div>
   <div id="toast-root" aria-live="polite"></div>
</body>
</html>
